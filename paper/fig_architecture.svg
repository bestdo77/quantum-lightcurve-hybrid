<text x="377.5" y="72.2" font-family="Arial, Helvetica, sans-serif" font-size="8pt" font-weight="normal" text-anchor="middle" fill="#253444">147 to 128 to 10</text>
<circle id="a-sum" cx="450" cy="98" r="11" fill="white" stroke="#596C7E"/>
