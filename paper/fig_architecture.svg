<text x="40.5" y="109.2" font-family="Arial, Helvetica, sans-serif" font-size="8pt" font-weight="bold" text-anchor="middle" fill="#253444">359 features</text>
<text x="40.5" y="120.2" font-family="Arial, Helvetica, sans-serif" font-size="8pt" font-weight="normal" text-anchor="middle" fill="#253444">atan inputs</text>
<g id="a-backbone"><rect x="95" y="43" width="95" height="42" rx="4" fill="#F1F4F7" stroke="#596C7E" stroke-width="0.8"/></g>
