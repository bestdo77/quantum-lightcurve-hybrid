<text x="265.0" y="156.2" font-family="Arial, Helvetica, sans-serif" font-size="8pt" font-weight="normal" text-anchor="middle" fill="#253444">12 re-uploading layers</text>
<text x="265.0" y="167.2" font-family="Arial, Helvetica, sans-serif" font-size="8pt" font-weight="normal" text-anchor="middle" fill="#253444">27 XYZ observables</text>
<g id="a-concat"><rect x="210" y="43" width="100" height="42" rx="4" fill="#F1F4F7" stroke="#596C7E" stroke-width="0.8"/></g>
<text x="260.0" y="61.2" font-family="Arial, Helvetica, sans-serif" font-size="8pt" font-weight="bold" text-anchor="middle" fill="#253444">Normalise + join</text>
<text x="260.0" y="72.2" font-family="Arial, Helvetica, sans-serif" font-size="8pt" font-weight="normal" text-anchor="middle" fill="#253444">120 + 27 features</text>
