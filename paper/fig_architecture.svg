<text x="307" y="25" font-family="Arial, Helvetica, sans-serif" font-size="7.5pt" font-weight="normal" text-anchor="middle" fill="#253444">Backbone classifier: 120 to 10 logits</text>
<g id="a-predict"><polyline points="450,109 450,126 435,126 435,137" fill="none" stroke="#596C7E" stroke-width="1"/><polygon points="435,137 433.2601378635551,133.39821159058928 436.7398621364449,133.39821159058928" fill="#596C7E"/></g>
<text x="95" y="194" font-family="Arial, Helvetica, sans-serif" font-size="7.5pt" font-weight="normal" text-anchor="start" fill="#253444">Quantum branch: 324 rotation parameters + 216 re-uploading parameters</text>
<line x1="8" y1="204" x2="472" y2="204" stroke="#D7DFE5" stroke-width="0.6"/>
