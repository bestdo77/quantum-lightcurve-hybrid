<text x="142.5" y="72.2" font-family="Arial, Helvetica, sans-serif" font-size="8pt" font-weight="normal" text-anchor="middle" fill="#253444">120 features</text>
<g id="a-encoding"><rect x="95" y="126" width="95" height="55" rx="4" fill="#F1F4F7" stroke="#596C7E" stroke-width="0.8"/></g>
<text x="142.5" y="145.2" font-family="Arial, Helvetica, sans-serif" font-size="8pt" font-weight="bold" text-anchor="middle" fill="#253444">Input encoding</text>
<text x="142.5" y="156.2" font-family="Arial, Helvetica, sans-serif" font-size="8pt" font-weight="normal" text-anchor="middle" fill="#253444">512 amplitudes</text>
<text x="142.5" y="167.2" font-family="Arial, Helvetica, sans-serif" font-size="8pt" font-weight="normal" text-anchor="middle" fill="#253444">9 grouped angles</text>
