<svg xmlns="http://www.w3.org/2000/svg" width="480pt" height="325pt" viewBox="0 0 480 325">
<title>Reported residual hybrid and fixed score fusion</title>
<desc>The main model uses global amplitude encoding with grouped angle re-uploading. The older model combines two independently trained classifiers by fixed score fusion.</desc>
<rect x="0" y="0" width="480" height="325" fill="white"/>
<text x="8" y="13" font-family="Arial, Helvetica, sans-serif" font-size="10pt" font-weight="bold" text-anchor="start" fill="#253444">a  Main residual hybrid</text>
