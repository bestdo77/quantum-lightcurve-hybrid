<g id="b-mean-output"><polyline points="356,269 382,269" fill="none" stroke="#596C7E" stroke-width="1"/><polygon points="382,269 378.3982115905893,270.7398621364449 378.3982115905893,267.2601378635551" fill="#596C7E"/></g>
<text x="95" y="316" font-family="Arial, Helvetica, sans-serif" font-size="7.5pt" font-weight="normal" text-anchor="start" fill="#253444">Classical fusion control: Window MLP + Dense MLP; 0.6 / 0.4 probability mixture</text>
